name: Quantum Sentinel Auto-Scan
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Sentinel HUD
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash generate_hud.sh
      - name: Commit Updated HUD
        run: |
          git config user.name "Sentinel Bot"
          git config user.email "bot@users.noreply.github.com"
          git add quantum.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update quantum sentinel telemetry" && git push)
